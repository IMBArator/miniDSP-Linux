[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minidsp-linux"
version = "1.5.0"
description = "USB HID control and protocol analysis for the t.racks DSP 4x4 Mini"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "tomli-w>=1.0",
    "rich>=13.0",
    # Windows HID transport (minidsp/transport.py). Linux uses /dev/hidraw
    # and installs nothing extra.
    "hidapi>=0.14; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "ty>=0.0.104",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5",
    "mkdocs-include-markdown-plugin>=6.2",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
]

[project.scripts]
minidsp = "minidsp.cli:main"
dspanalyze = "dspanalyze.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["minidsp", "dspanalyze"]

[tool.hatch.build.targets.wheel.force-include]
"minidsp/calibration.toml" = "minidsp/calibration.toml"
"minidsp/factory_defaults.toml" = "minidsp/factory_defaults.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes + pycodestyle + isort + pyupgrade + bugbear
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long lines are a formatting matter; the formatter is not enforced

[tool.ruff.lint.isort]
# Every module starts with the future import; ruff adds it where it is missing.
required-imports = ["from __future__ import annotations"]

[tool.ty.analysis]
# `hid` (PyPI hidapi) is a compiled extension without type stubs, and it is only
# installed on Windows; minidsp/transport.py imports it lazily. ty cannot resolve
# it on any platform, so treat it as untyped instead of reporting it.
allowed-unresolved-imports = ["hid"]
